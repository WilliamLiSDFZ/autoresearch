[project]
name = "autoresearch"
version = "0.1.0"
description = "Autonomous pretraining research swarm"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "kernels>=0.11.7",
    "matplotlib>=3.10.8",
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "pyarrow>=21.0.0",
    "requests>=2.32.0",
    "rustbpe>=0.1.0",
    "tiktoken>=0.11.0",
    "torch==2.9.1",
]

[dependency-groups]
# CPU-only retrieval can be installed with `uv sync --only-group analogy`.
# These versions follow MLEvolve's analogy/full-text runtime.
analogy = [
    "numpy>=2.2.6",
    "rank-bm25==0.2.2",
    "nltk==3.9.1",
    "openai==1.66.3",
    "httpx==0.28.1",
    "jsonschema==4.25.1",
    "pymupdf==1.28.0",
    "pymupdf4llm==1.28.0",
    "pymupdf-layout==1.28.0",
    # Newer ONNX Runtime releases lack CPython 3.10 wheels despite their metadata.
    "onnxruntime==1.23.2; python_version < '3.11'",
    "tabulate==0.9.0",
    "tiktoken>=0.11.0",
]

[tool.uv]
default-groups = ["analogy"]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
