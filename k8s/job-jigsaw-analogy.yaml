# Edit the pair name, PVC subPaths and GPU allow-list together in BOTH Jobs.
# Reuse the dev Pod's existing .venv; the agent creates its run worktree.
apiVersion: batch/v1
kind: Job
metadata:
  name: autoresearch-jubias-pair-001-analogy
  namespace: ecepxie
  labels:
    app: autoresearch-jigsaw
    experiment-pair: jubias-pair-001
    experiment-arm: analogy
spec:
  completions: 1
  parallelism: 1
  backoffLimit: 0
  activeDeadlineSeconds: 21600  # 6 hours from Job start, including setup/waiting.
  template:
    metadata:
      labels:
        app: autoresearch-jigsaw
        experiment-pair: jubias-pair-001
        experiment-arm: analogy
    spec:
      restartPolicy: Never
      terminationGracePeriodSeconds: 1
      automountServiceAccountToken: false
      hostPID: false
      shareProcessNamespace: false
      # Accept multiple GPU models with at least 24 GB; record the allocated model.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.product
                    operator: In
                    values:
                      - NVIDIA-GeForce-RTX-3090
                      - NVIDIA-GeForce-RTX-4090
                      - NVIDIA-TITAN-RTX
                      - NVIDIA-A10
                      - NVIDIA-RTX-A5000
                      - NVIDIA-L4
                      - Tesla-V100-SXM2-32GB
                      - NVIDIA-A40
                      - NVIDIA-RTX-A6000
                      - NVIDIA-L40
                      - NVIDIA-L40S
                      - Quadro-RTX-8000
                      - NVIDIA-A100-PCIE-40GB
                      - NVIDIA-A100-SXM4-40GB
                      - NVIDIA-A100-80GB-PCIe
                      - NVIDIA-A100-SXM4-80GB
                # Temporary: repeated GPU admission and CSI failures on 2026-09-20.
                matchFields:
                  - key: metadata.name
                    operator: NotIn
                    values:
                      - nautilus-ext-gpu01.fullerton.edu
      containers:
        - name: researcher
          image: pytorch/pytorch:2.7.1-cuda12.6-cudnn9-runtime
          imagePullPolicy: IfNotPresent
          workingDir: /workspace/autoresearch
          command: [bash, -c]
          args:
            - |
              set -euo pipefail
              if [ ! -f "$AUTORESEARCH_SOURCE_DIR/pyproject.toml" ] || [ ! -d "$AUTORESEARCH_SOURCE_DIR/.git" ]; then
                printf 'Expected the main Git checkout at %s; check the PVC subPath.\n' "$AUTORESEARCH_SOURCE_DIR" >&2
                exit 1
              fi
              apt-get update
              apt-get install -y git curl ca-certificates gcc
              if [ -n "$(git --no-optional-locks -C "$AUTORESEARCH_SOURCE_DIR" status --porcelain)" ]; then
                printf 'The shared main checkout must be clean before starting research.\n' >&2
                exit 1
              fi
              git -C "$AUTORESEARCH_SOURCE_DIR" rev-parse HEAD > /tmp/autoresearch-start-commit
              if [ ! -f "$AUTORESEARCH_VENV/bin/activate" ] || [ ! -x "$AUTORESEARCH_VENV/bin/python" ]; then
                printf 'Missing or broken shared venv at %s; prepare it once in the dev Pod and check the Python interpreter mount.\n' "$AUTORESEARCH_VENV" >&2
                exit 1
              fi
              source "$AUTORESEARCH_VENV/bin/activate"
              if [ "$VIRTUAL_ENV" != "$AUTORESEARCH_VENV" ]; then
                printf 'The shared venv was created at a different path; recreate it at %s in the dev Pod.\n' "$AUTORESEARCH_VENV" >&2
                exit 1
              fi
              "$AUTORESEARCH_VENV/bin/python" -c 'import os, sys, numpy, pandas, torch; assert sys.prefix == os.environ["AUTORESEARCH_VENV"], "Unexpected Python environment"; assert torch.__version__.split("+")[0] == "2.9.1", "Shared venv must match uv.lock"; assert torch.cuda.is_available(), "CUDA is unavailable"; print("Using shared venv:", sys.prefix, "Python:", sys.version.split()[0], "Torch:", torch.__version__, "GPU:", torch.cuda.get_device_name(0))'
              if [ ! -x "$CLAUDE_BIN" ]; then
                printf 'Claude Code is not executable at %s; check the PVC mount and CLAUDE_BIN.\n' "$CLAUDE_BIN" >&2
                exit 1
              fi
              ln -s "$CLAUDE_BIN" /usr/local/bin/claude
              claude --version
              touch /tmp/autoresearch-ready
              printf 'Setup complete. Run claude here; the agent must create its worktree at %s.\n' "$AUTORESEARCH_REPO_DIR"
              # The agent signals the end of the entire research run after saving results.
              while [ ! -f /tmp/autoresearch-finished ] && [ ! -f /tmp/autoresearch-failed ]; do
                sleep 2
              done
              if [ -f /tmp/autoresearch-failed ]; then
                printf 'Research stopped with a failure; see the saved run summary.\n' >&2
                exit 1
              fi
              printf 'Research finished; stopping the Pod.\n'
              exit 0
          env:
            - name: EXPERIMENT_ARM
              value: analogy
            - name: RUN_TAG
              value: jubias-pair-001-analogy
            # Assumes the existing native install uses the dev Pod's HOME.
            # Keep the original mount path so absolute symlinks still resolve.
            - name: CLAUDE_BIN
              value: /workspace/home/.local/bin/claude
            - name: AUTORESEARCH_SOURCE_DIR
              value: /workspace/autoresearch
            # Created by the agent with git worktree add; never checkout the main tree.
            - name: AUTORESEARCH_REPO_DIR
              value: /workspace/autoresearch/worktrees/jubias-pair-001-analogy
            # Reuse the dev Pod's locked environment; never install into it here.
            - name: AUTORESEARCH_VENV
              value: /workspace/autoresearch/.venv
            - name: VIRTUAL_ENV
              value: /workspace/autoresearch/.venv
            - name: PYTHONDONTWRITEBYTECODE
              value: '1'
            - name: AUTORESEARCH_JIGSAW_DIR
              value: /data/jigsaw-prepared
            - name: AUTORESEARCH_TASK_FILE
              value: /data/task/description.md
            - name: AUTORESEARCH_RESOURCES
              value: '1x NVIDIA GPU from allow-list (>=24GB VRAM); CPU=8; RAM=32Gi'
            # KB path and model endpoint are configured here. Credentials are
            # entered manually inside this Pod before launching Claude.
            - name: ANALOGY_CORPUS_DIR
              value: /data/paper-corpus
            - name: ANALOGY_MODEL
              value: gpt-5.6-sol
            - name: ANALOGY_BASE_URL
              value: http://cliproxy:8317/v1
            - name: PYTHONUNBUFFERED
              value: '1'
            - name: DISABLE_AUTOUPDATER
              value: '1'
          resources:
            requests:
              cpu: '8'
              memory: 32Gi
              nvidia.com/gpu: 1
            limits:
              cpu: '8'
              memory: 32Gi
              nvidia.com/gpu: 1
          readinessProbe:
            exec:
              command: [test, -f, /tmp/autoresearch-ready]
            periodSeconds: 5
          volumeMounts:
            - name: workspace
              mountPath: /workspace/autoresearch
              subPath: autoresearch
            - name: workspace
              mountPath: /workspace/autoresearch/.venv
              subPath: autoresearch/.venv
              readOnly: true
            # Keep uv-managed Python symlink targets at the dev Pod's absolute path.
            - name: workspace
              mountPath: /workspace/.local/share/uv/python
              subPath: .local/share/uv/python
              readOnly: true
            - name: workspace
              mountPath: /root
              subPath: autoresearch-pairs/jubias-pair-001/analogy/home
            - name: workspace
              mountPath: /data/jigsaw-prepared
              subPath: autoresearch/results/jigsaw-data
              readOnly: true
            # Protect the same dataset at its path inside the shared main repository.
            - name: workspace
              mountPath: /workspace/autoresearch/results/jigsaw-data
              subPath: autoresearch/results/jigsaw-data
              readOnly: true
            - name: workspace
              mountPath: /data/task/description.md
              subPath: data/mlebench/jigsaw-unintended-bias-in-toxicity-classification/prepared/public/description.md
              readOnly: true
            - name: workspace
              mountPath: /workspace/home/.local
              subPath: home/.local
              readOnly: true
            - name: workspace
              mountPath: /data/paper-corpus
              subPath: Agentic_Knowledge_Base/output/paper_corpus
              readOnly: true
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: yuze-li-vol
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
